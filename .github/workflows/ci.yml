name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    env:
      AGENT_API_KEY: ci-dummy-key
      REDIS_URL: fake://
      RATE_LIMIT_PER_MINUTE: "10"
      MONTHLY_BUDGET_USD: "10.0"
      LOG_LEVEL: INFO

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: >
          pytest tests
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py
          -v

  build:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t day12-agent:${{ github.sha }} .

  deploy:
    name: Deploy Railway
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy application
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --project 0689a36b-16df-4f4e-98f2-e2f12371ec26 \
            --service Lab12_2A202602936 \
            --environment production \
            --ci

      - name: Smoke test
        run: |
          for attempt in {1..12}; do
            if curl -fsS "${{ vars.PUBLIC_URL }}/health" \
              && curl -fsS "${{ vars.PUBLIC_URL }}/ready"; then
              echo "Deployment is healthy"
              exit 0
            fi

            echo "Waiting for deployment: attempt ${attempt}/12"
            sleep 10
          done

          echo "Deployment did not become healthy"
          exit 1